name: Deploy a GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validar JSON de datos
        run: |
          python -m json.tool docs/data/brands.json > /dev/null
          python -m json.tool docs/data/models.json > /dev/null
          echo "JSON válidos ✔"

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Subir sitio estático (docs/)
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
